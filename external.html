<!DOCTYPE html>
<html>
<head>
<title>E-Commerce Page</title>

<style>
body{
    font-family: Arial;
    background-color: lightgray;
}

.container{
    width: 70%;
    margin: 40px auto;
}

.product{
    background-color: white;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 10px;
}

h2{
    color: darkblue;
}

.price{
    color: red;
    font-size: 18px;
}

button{
    background-color: blue;
    color: white;
    padding: 8px 15px;
    border: none;
    margin-top: 10px;
}
</style>

</head>

<body>

<div class="container">

<div class="product">
<h2>Wireless Headphones</h2>
<img src="product1.jpg" width="150">
<p class="price">Price: ₹2999</p>
<p>High quality sound with long battery backup.</p>
<button>Add to Cart</button>
<button>Buy Now</button>
</div>

<div class="product">
<h2>Smart Watch</h2>
<img src="product2.jpg" width="150">
<p class="price">Price: ₹1999</p>
<p>Fitness tracking with heart rate monitor.</p>
<button>Add to Cart</button>
<button>Buy Now</button>
</div>

</div>

</body>
</html>
